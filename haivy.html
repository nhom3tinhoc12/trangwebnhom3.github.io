<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Trang cá nhân - Hải Vy</title>
<style>
body {
    font-family: "Be Vietnam Pro", sans-serif;
    background: linear-gradient(135deg, #ff8fb1, #ffb3d9, #ffd6e8);
    background-size: 300% 300%;
    animation: bgFlow 12s ease infinite;
    margin: 0;
    padding: 40px 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
}

@keyframes bgFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.card {
    width: 480px;
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(12px);
    padding: 35px;
    border-radius: 28px;
    text-align: center;
    box-shadow: 0 8px 35px rgba(255, 60, 120, 0.25);
    animation: fadeIn 1s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.avatar {
    width: 170px;
    height: 170px;
    border-radius: 50%;
    object-fit: cover;
    border: 6px solid rgba(255, 80, 140, 0.6);
    box-shadow: 0 0 25px rgba(255, 70, 130, 0.7);
    animation: pulse 3s infinite ease-in-out;
}

@keyframes pulse {
    0% { box-shadow: 0 0 20px rgba(255, 70, 120, 0.55); }
    50% { box-shadow: 0 0 50px rgba(255, 50, 110, 0.9); }
    100% { box-shadow: 0 0 20px rgba(255, 70, 120, 0.55); }
}

h1 {
    color: #ff2e72;
    font-size: 32px;
    margin-top: 18px;
}

.section {
    margin: 15px 0;
    font-size: 18px;
    color: #6b2c3f;
    line-height: 1.6;
}

.return {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 24px;
    background: #ff4d88;
    color: white;
    border-radius: 12px;
    font-weight: bold;
    text-decoration: none;
    transition: 0.3s;
}

.return:hover {
    background: #ff2e72;
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(255, 50, 120, 0.4);
}

.heart {
    position: fixed;
    top: -20px;
    color: #ff1e6e;
    font-size: 20px;
    animation: fall 6s linear infinite;
    opacity: 0.9;
}

@keyframes fall {
    0% { transform: translateY(-40px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
}
</style>
</head>
<body>

<script>
for (let i = 0; i < 40; i++) {
    let heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (16 + Math.random() * 22) + "px";
    heart.style.animationDuration = (4 + Math.random() * 5) + "s";
    heart.style.animationDelay = Math.random() * 5 + "s";
    document.body.appendChild(heart);
}
</script>

<div class="card">
    <img class="avatar" src="https://genk.mediacdn.vn/2018/7/16/09ca66ba-f8a0-48ad-af32-ab67d5007490-1531714507245812030734.jpg">

    <h1>Hải Vy</h1>

    <div class="section"><b>Ngày sinh:</b> 01/01/2008</div>

    <div class="section"><b>Định hướng nghề nghiệp:</b><br> Kế toán hoặc huấn luyện viên thú cưng</div>

    <div class="section"><b>Tính cách:</b><br> Hòa đồng · Kiên nhẫn · Luôn học hỏi</div>

    <div class="section"><b>Mục tiêu:</b><br> Phát triển bản thân · Xây dựng định hướng rõ ràng · Cải thiện kỹ năng</div>

    <div class="section"><b>Sở thích:</b> Nấu ăn · Game · Đạp xe</div>

    <a class="return" href="index.html">⬅ Quay lại</a>
</div>

</body>
</html>
