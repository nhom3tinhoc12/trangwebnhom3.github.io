<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Trang cá nhân - Hải Vy</title>
<style>
body {
    font-family: "Be Vietnam Pro", sans-serif;
    background: linear-gradient(135deg,#ff8fb1,#ffb3d9,#ffd6e8);
    background-size: 300% 300%;
    animation: bgFlow 12s ease infinite;
    margin: 0;
    padding: 40px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
}
@keyframes bgFlow {
    0% { background-position:0% 50%; } 50% { background-position:100% 50%; } 100% { background-position:0% 50%; }
}
.card { width:500px; background: rgba(255,255,255,0.6); backdrop-filter: blur(12px); padding:40px; border-radius:30px; text-align:center; box-shadow:0 12px 40px rgba(255,60,120,0.3); animation:fadeIn 1s ease; margin-bottom:25px;}
@keyframes fadeIn { from {opacity:0; transform:translateY(30px);} to {opacity:1; transform:translateY(0);} }
.avatar-container { position:relative; display:inline-block; animation:rotate 10s linear infinite;}
.avatar { width:180px; height:180px; border-radius:50%; object-fit:cover; border:6px solid rgba(255,80,140,0.6); box-shadow:0 0 35px rgba(255,70,130,0.8);}
@keyframes rotate {0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);}}
h1 {color:#ff2e72; font-size:34px; margin-top:20px;}
.slogan-card { width:520px; background: rgba(255,255,255,0.25); backdrop-filter: blur(18px); padding:30px 40px; border-radius:32px; text-align:center; box-shadow:0 8px 30px rgba(255,30,110,0.4); font-size:22px; font-weight:bold; color:#ff1e6e; animation: glowFade 2s ease-in-out infinite alternate, fadeIn 1.5s ease; margin-top:25px; border:2px solid rgba(255,30,110,0.5);}
@keyframes glowFade {0%{box-shadow:0 0 15px rgba(255,30,110,0.6);}100%{box-shadow:0 0 35px rgba(255,30,110,1);}}
.section { margin:15px 0; font-size:18px; color:#6b2c3f; line-height:1.6;}
.return { display:inline-block; margin-top:25px; padding:12px 28px; background:#ff4d88; color:white; border-radius:14px; font-weight:bold; text-decoration:none; transition:0.3s; }
.return:hover { background:#ff2e72; transform:translateY(-4px); box-shadow:0 8px 25px rgba(255,50,120,0.4);}
.heart {position:fixed; top:-20px; color:#ff1e6e; font-size:22px; animation:fall 6s linear infinite; opacity:0.9;}
@keyframes fall {0%{transform:translateY(-40px) rotate(0deg); opacity:1;} 100%{transform:translateY(110vh) rotate(360deg); opacity:0;}}
</style>
</head>
<body>

<script>
for(let i=0;i<50;i++){ let heart=document.createElement("div"); heart.classList.add("heart"); heart.innerHTML="❤"; heart.style.left=Math.random()*100+"vw"; heart.style.fontSize=(18+Math.random()*24)+"px"; heart.style.animationDuration=(4+Math.random()*5)+"s"; heart.style.animationDelay=Math.random()*5+"s"; document.body.appendChild(heart);}
</script>

<div class="card">
    <div class="avatar-container"><img class="avatar" src="https://thuthuatnhanh.com/wp-content/uploads/2022/06/Anh-sieu-nhan-mau-do.jpg"></div>
    <h1>Hải Vy</h1>
</div>

<div class="card">
    <div class="section"><b>Ngày sinh:</b> 01/01/2008</div>
    <div class="section"><b>Định hướng nghề nghiệp:</b> Kế toán · Huấn luyện viên thú cưng</div>
    <div class="section"><b>Tính cách:</b> Hòa đồng · Kiên nhẫn · Luôn học hỏi</div>
    <div class="section"><b>Mục tiêu:</b> Nâng cao kỹ năng · Xây dựng sự tự tin · Hoàn thiện bản thân</div>
    <div class="section"><b>Sở thích:</b> Nấu ăn · Game · Đạp xe</div>
    <a class="return" href="index.html">⬅ Quay lại</a>
</div>

<div class="slogan-card">"Red Power: Mạnh mẽ và tự tin!"</div>

</body>
</html>
