<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bài tập HTML Table</title>
<style>
body {
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background: #f5f5f5;
    padding: 40px;
    text-align: center;
}
h1 { color: #333; margin-bottom: 30px; }

button {
    padding: 12px 24px;
    margin: 10px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    background-color: #4CAF50;
    color: white;
    transition: 0.3s;
}
button:hover { background-color: #45a049; }

.table-container { 
    margin-top: 30px; 
    display: none; 
    overflow-x: auto;
}

table {
    border-collapse: collapse;
    margin: 0 auto;
    width: 80%;
}
th, td {
    padding: 12px 18px;
    text-align: center;
    font-size: 16px;
    border: 2px solid black;
}

/* Hàng tiêu đề bài 1 */
th.luyen-tap { border: 2px solid blue; }

/* Cột Toán, Vật lí, Hóa học bài 1 */
th.toan { border: 2px solid red; color: red; }
th.vatly { border: 2px solid orange; color: orange; }
th.hoa { border: 2px solid green; color: green; }

/* Bài vận dụng (màu xanh) */
th.vd { border: 2px solid navy; background-color: #cce6ff; }

/* Hover dòng */
tr:hover td { background-color: #f0e68c; }

</style>
</head>
<body>

<h1>Bài tập HTML Table</h1>

<button onclick="showTable('luyenTap')">Bài Luyện tập</button>
<button onclick="showTable('vanDung')">Bài Vận dụng</button>

<!-- Bài Luyện tập -->
<div id="luyenTap" class="table-container">
    <h2>Bài Luyện tập</h2>
    <table>
        <tr>
            <th class="luyen-tap">Họ tên</th>
            <th class="toan">Toán</th>
            <th class="vatly">Vật lí</th>
            <th class="hoa">Hóa học</th>
        </tr>
        <tr>
            <td>Nguyễn Văn A</td>
            <td>8.5</td>
            <td>7.0</td>
            <td>9.0</td>
        </tr>
        <tr>
            <td>Trần Thị B</td>
            <td>7.0</td>
            <td>8.0</td>
            <td>8.5</td>
        </tr>
    </table>
</div>

<!-- Bài Vận dụng -->
<div id="vanDung" class="table-container">
    <h2>Bài Vận dụng</h2>
    <table>
        <tr>
            <th class="vd">Họ tên</th>
            <th class="vd">Điểm Toán</th>
            <th class="vd">Điểm Vật lí</th>
            <th class="vd">Điểm Hóa học</th>
        </tr>
        <tr>
            <td>Nguyễn Văn A</td>
            <td>8.5</td>
            <td>7.0</td>
            <td>9.0</td>
        </tr>
        <tr>
            <td>Trần Thị B</td>
            <td>7.0</td>
            <td>8.0</td>
            <td>8.5</td>
        </tr>
        <tr>
            <td>Lê Quang C</td>
            <td>6.5</td>
            <td>7.5</td>
            <td>8.0</td>
        </tr>
        <tr>
            <td>Phạm Thị D</td>
            <td>9.0</td>
            <td>8.5</td>
            <td>7.5</td>
        </tr>
    </table>
</div>

<script>
function showTable(tableId) {
    const tables = document.querySelectorAll('.table-container');
    tables.forEach(tbl => tbl.style.display = 'none');
    document.getElementById(tableId).style.display = 'block';
}
</script>

</body>
</html>
