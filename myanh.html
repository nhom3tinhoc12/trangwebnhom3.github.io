<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Trang cá nhân - Mỹ Anh</title>
  <style>
    body {
      font-family: "Be Vietnam Pro";
      margin: 0;
      padding: 0;
      overflow: hidden; /* Đảm bảo không xuất hiện thanh cuộn */
      position: relative;
      
      /* Nền chấm bi (polka dots) */
      background: radial-gradient(circle, #ff4f9c 10%, transparent 10%) 0 0,
                  radial-gradient(circle, #ff4f9c 10%, transparent 10%) 50px 50px;
      background-size: 100px 100px; /* Kích thước của các chấm bi */
      background-attachment: fixed; /* Giữ hình nền cố định khi cuộn trang */
    }

    /* Nền ô caro chuyển động */
    .checkerboard {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(45deg, #ff4f9c 25%, transparent 25%, transparent 50%, #ff4f9c 50%, #ff4f9c 75%, transparent 75%, transparent);
      animation: moveBackground 3s linear infinite;
    }

    @keyframes moveBackground {
      0% {
        background-position: 0 0;
      }
      100% {
        background-position: 100px 100px;
      }
    }
