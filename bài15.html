      <h2>Luyện tập 1</h2>
      <p><b>Câu hỏi:</b> "Thiết lập bảng màu theo quy tắc của hệ màu RGB. Giá trị của mỗi màu được thiết lập bởi RGB (x-red, x-green, x-blue). Trong đó: x-red, x-green, x-blue có thể nhận các giá trị độc lập từ 0 đến 255."</p>
      <p><b>Câu trả lời:</b></p>
      <img src="https://vietjack.com/tin-hoc-12-kn/images/luyen-tap-1-trang-88-tin-hoc-12.PNG" alt="Bảng màu RGB">

    <section id="lt2">
      <h2>Luyện tập 2</h2>
      <p><b>Câu hỏi:</b> "Khi nào các mẫu định dạng E F và E &gt; F có tác dụng như nhau?"</p>
      <p><b>Câu trả lời:</b> Các mẫu định dạng <b>E F</b> và <b>E &gt; F</b> trong CSS có tác dụng như nhau khi phần tử <b>F</b> là <b>con trực tiếp</b> của phần tử <b>E</b>. Trong trường hợp này, cả hai mẫu đều áp dụng cho phần tử F nằm trong phần tử E, nghĩa là phần tử F phải là con trực tiếp của E và không nằm trong bất kỳ phần tử con trung gian nào khác.</p>
    </section>

    <section id="vd1">
      <h2>Vận dụng 1</h2>
      <p><b>Câu hỏi:</b> "Tìm ví dụ và giải thích ý nghĩa cho các mẫu định dạng CSS tổng quát như sau:<br>a) E1 E2 E3.<br>b) E1 &gt; E2 &gt; E3."</p>
      <p><b>Câu trả lời:</b></p>
      <p><b>a) Mẫu định dạng E1 E2 E3:</b> Đây là một mẫu kết hợp (<i>descendant selector</i>) trong CSS, áp dụng cho các phần tử E3 nằm trong phần tử E2, và phần tử E2 nằm trong phần tử E1.</p>
      <img src="https://img.loigiaihay.com/picture/2024/0817/iai-tin-hoc-12-bai-15-trang-88-sgk-ket-noi-tri-thuc-1723868980_5.jpg" alt="E1 E2 E3">
      <p><b>b) Mẫu định dạng E1 &gt; E2 &gt; E3:</b> Đây là mẫu con trực tiếp.</p>
      <img src="https://img.loigiaihay.com/picture/2024/0817/iai-tin-hoc-12-bai-15-trang-88-sgk-ket-noi-tri-thuc-1723868980_6.jpg" alt="E1 > E2 > E3">
    </section>

    <section id="vd2">
      <h2>Vận dụng 2</h2>
      <p><b>Câu hỏi:</b> "Tìm ví dụ và giải thích ý nghĩa cho các mẫu định dạng CSS tổng quát như sau:<br>a) E + F + G.<br>b) E &gt; F + G."</p>
      <p><b>Câu trả lời:</b></p>
      <p><b>a) Mẫu định dạng E + F + G:</b> Đây là mẫu anh em liền kề.</p>
      <img src="https://img.loigiaihay.com/picture/2024/0817/iai-tin-hoc-12-bai-15-trang-88-sgk-ket-noi-tri-thuc-1723868980_7.jpg" alt="E + F + G">
      <p><b>b) Mẫu định dạng E &gt; F + G:</b> Kết hợp con trực tiếp và anh em.</p>
      <img src="https://img.loigiaihay.com/picture/2024/0817/iai-tin-hoc-12-bai-15-trang-88-sgk-ket-noi-tri-thuc-1723868980_8.jpg" alt="E > F + G">
    </section>
