<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bài tập Form HTML</title>

<style>
body {
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background: #f5f5f5;
    padding: 40px;
    text-align: center;
}

h1 { color: #333; margin-bottom: 30px; }

button {
    padding: 12px 24px;
    margin: 10px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    background-color: #4CAF50;
    color: white;
    transition: 0.3s;
}
button:hover { background-color: #45a049; }

.form-container { 
    margin-top: 30px;
    display: none;
    text-align: left;
    width: 60%;
    margin-left: auto;
    margin-right: auto;
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 0 10px #ccc;
}

/* Khung Luyện tập */
#luyenTap h2 { color: blue; }

/* Khung Vận dụng */
#vanDung h2 { color: #003399; }

label {
    font-weight: bold;
}

input, select, textarea {
    width: 100%;
    padding: 10px;
    margin: 8px 0 20px 0;
    border-radius: 6px;
    border: 1px solid #999;
}

iframe {
    width: 100%;
    height: 300px;
    border: 2px solid #003399;
    margin-top: 20px;
}
</style>
</head>

<body>

<h1>Bài tập Form HTML</h1>

<button onclick="showForm('luyenTap')">Bài Luyện tập</button>
<button onclick="showForm('vanDung')">Bài Vận dụng</button>

<!-- =================== Luyện tập =================== -->
<div id="luyenTap" class="form-container">
    <h2>Phần Luyện tập</h2>

    <h3>Form đăng ký tài khoản</h3>
    <form action="/register" method="post">
        <label for="username">Tên đăng nhập:</label>
        <input type="text" id="username" name="username" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Mật khẩu:</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Đăng ký</button>
    </form>

    <hr>

    <h3>Form tìm kiếm</h3>
    <form action="/search" method="get">
        <input type="text" name="keyword" placeholder="Nhập từ khóa...">
        <button type="submit">Tìm kiếm</button>
    </form>

    <hr>

    <h3>Form chọn giới tính</h3>
    <select name="gender">
        <option value="male">Nam</option>
        <option value="female">Nữ</option>
        <option value="other">Khác</option>
    </select>
</div>

<!-- =================== Vận dụng =================== -->
<div id="vanDung" class="form-container">
    <h2>Bài Vận dụng</h2>

    <h3>Biểu mẫu đăng ký thành viên Câu lạc bộ</h3>

    <form action="/dang-ky-clb" method="post">

        <label for="fullname">Họ và tên:</label>
        <input type="text" id="fullname" name="fullname" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Số điện thoại:</label>
        <input type="tel" id="phone" name="phone" required>

        <label for="gender">Giới tính:</label>
        <select id="gender" name="gender">
            <option value="male">Nam</option>
            <option value="female">Nữ</option>
            <option value="other">Khác</option>
        </select>

        <label for="birthday">Ngày sinh:</label>
        <input type="date" id="birthday" name="birthday">

        <label for="club">Chọn câu lạc bộ:</label>
        <select id="club" name="club">
            <option value="music">Câu lạc bộ Âm nhạc</option>
            <option value="sport">Câu lạc bộ Thể thao</option>
            <option value="english">Câu lạc bộ Tiếng Anh</option>
            <option value="volunteer">Câu lạc bộ Tình nguyện</option>
        </select>

        <label for="reason">Lý do tham gia:</label>
        <textarea id="reason" name="reason" rows="4" placeholder="Hãy chia sẻ lý do bạn muốn tham gia..."></textarea>

        <label><input type="checkbox" name="agree" required> Tôi đồng ý với các điều khoản tham gia.</label>

        <button type="submit">Gửi đăng ký</button>
    </form>

    <hr>

    <h3>Liên kết mở nội dung trong iframe</h3>
    <p>
        <a href="dangky_clb.html" target="khung_iframe">Đăng ký (mở trong iframe)</a>
    </p>

    <iframe name="khung_iframe"></iframe>
</div>

<script>
function showForm(id) {
    document.querySelectorAll('.form-container').forEach(div => {
        div.style.display = "none";
    });
    document.getElementById(id).style.display = "block";
}
</script>

</body>
</html>
