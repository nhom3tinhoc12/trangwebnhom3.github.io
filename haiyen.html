<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Trang cá nhân - Hải Yến</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap');

body {
    font-family: "Be Vietnam Pro", sans-serif;
    margin: 0;
    padding: 40px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
    background: linear-gradient(270deg, #b3d9ff, #cce6ff, #e0f0ff);
    background-size: 600% 600%;
    animation: neonWave 15s ease infinite;
}

@keyframes neonWave {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.card {
    width: 500px;
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(12px);
    padding: 40px;
    border-radius: 30px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,102,204,0.3);
    animation: fadeIn 1s ease;
    margin-bottom: 25px;
    position: relative;
    z-index: 1;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

.avatar-container {
    position: relative;
    display: inline-block;
    animation: rotate 10s linear infinite;
    z-index: 1;
}

.avatar {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    object-fit: cover;
    border: 6px solid rgba(0,102,204,0.6);
    box-shadow: 0 0 35px rgba(0,102,204,0.8);
    transition: 0.5s ease;
}

.avatar-container:hover .avatar {
    transform: scale(1.1) rotate(10deg);
    box-shadow: 0 0 50px rgba(0,102,204,0.9);
}

@keyframes rotate {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

h1 { color: #0066cc; font-size: 34px; margin-top: 20px; }

.slogan-card {
    width: 520px;
    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(18px);
    padding: 30px 40px;
    border-radius: 32px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,102,204,0.4);
    font-size: 22px;
    font-weight: bold;
    color: #0066cc;
    animation: glowFade 2s ease-in-out infinite alternate, pulse 3s ease-in-out infinite, fadeIn 1.5s ease;
    margin-top: 25px;
    border: 2px solid rgba(0,102,204,0.5);
    position: relative;
    z-index: 1;
}

@keyframes glowFade {
    0% { box-shadow: 0 0 15px rgba(0,102,204,0.6); }
    100% { box-shadow: 0 0 35px rgba(0,102,204,1); }
}

@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

.section { margin: 15px 0; font-size: 18px; color: #1f4d6b; line-height: 1.6; }

.return {
    display: inline-block;
    margin-top: 25px;
    padding: 12px 28px;
    background: #3399ff;
    color: white;
    border-radius: 14px;
    font-weight: bold;
    text-decoration: none;
    transition: 0.3s;
}

.return:hover {
    background: #0066cc;
    transform: translateY(-4px);
    box-shadow: 0 8px 25px rgba(0,102,204,0.4);
}

#effectLayer {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 0;
}

.star {
    position: absolute;
    color: #fff;
    font-size: 10px;
    opacity: 0.8;
    animation-name: starTwinkle;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
}

@keyframes starTwinkle {
    0% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); }
    100% { opacity: 0.3; transform: scale(1); }
}

.heartBubble {
    position: absolute;
    bottom: -30px;
    font-size: 15px;
    color: #ff1e6e;
    opacity: 0.8;
    animation-name: heartRise;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
}

@keyframes heartRise {
    0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
    50% { transform: translateY(-50vh) rotate(180deg); opacity: 1; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
}
</style>
</head>
<body>

<div id="effectLayer"></div>

<div class="card">
    <div class="avatar-container">
        <img class="avatar" src="https://i.pinimg.com/236x/24/ca/4b/24ca4bcc4f8c31a822f155cc71820ce3.jpg">
    </div>
    <h1>Hải Yến</h1>
</div>

<div class="card">
    <div class="section"><b>Ngày sinh:</b> 27/06/2008</div>
    <div class="section"><b>Định hướng nghề nghiệp:</b><br> Giáo viên · Biên tập nội dung</div>
    <div class="section"><b>Tính cách:</b><br> Thông minh · Nhiệt tình · Thận trọng</div>
    <div class="section"><b>Mục tiêu:</b><br> Phát triển kỹ năng giao tiếp · Học hỏi liên tục · Tích lũy kinh nghiệm</div>
    <div class="section"><b>Sở thích:</b> Âm nhạc · Vẽ · Đọc sách</div>
    <a class="return" href="index.html">⬅ Quay lại</a>
</div>

<div class="slogan-card">"Blue waves: Bình tĩnh và sáng suốt!"</div>

<script>
const effectLayer = document.getElementById('effectLayer');
for (let i = 0; i < 50; i++) {
    let star = document.createElement("div");
    star.classList.add("star");
    star.innerHTML = "✦";
    star.style.left = Math.random()*100 + "vw";
    star.style.top = Math.random()*100 + "vh";
    star.style.fontSize = (8 + Math.random()*12) + "px";
    star.style.animationDuration = (2 + Math.random()*3) + "s";
    effectLayer.appendChild(star);
}
for (let i = 0; i < 40; i++) {
    let heart = document.createElement("div");
    heart.classList.add("heartBubble");
    heart.innerHTML = "❤";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (12 + Math.random()*18) + "px";
    heart.style.animationDuration = (5 + Math.random()*5) + "s";
    heart.style.animationDelay = Math.random()*5 + "s";
    effectLayer.appendChild(heart);
}
</script>

</body>
</html>
